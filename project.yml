name: MDReader
options:
  bundleIdPrefix: fi.jarkkolietolahti
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  swift-cmark:
    url: https://github.com/swiftlang/swift-cmark
    branch: gfm
targets:
  MDReader:
    type: application
    platform: macOS
    sources:
      - path: MDReader/Sources
      - path: MDReader/Resources
    dependencies:
      - package: swift-cmark
        product: cmark-gfm
      - package: swift-cmark
        product: cmark-gfm-extensions
    info:
      path: MDReader/Info.plist
      properties:
        CFBundleName: MD Reader
        CFBundleDisplayName: MD Reader
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.productivity
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: false
        NSHumanReadableCopyright: "© 2026 Jarkko Lietolahti"
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [net.daringfireball.markdown]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).MarkdownDocument
          - CFBundleTypeName: Plain Text Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).MarkdownDocument
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo: [public.plain-text, public.text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown, mdown, mkdn, mkd, mdwn, mdtxt, mdtext]
              public.mime-type: [text/markdown, text/x-markdown]
    settings:
      base:
        PRODUCT_NAME: MD Reader
        PRODUCT_MODULE_NAME: MDReader
        SWIFT_VERSION: "5"
        SWIFT_STRICT_CONCURRENCY: minimal
        DEVELOPMENT_TEAM: 25C9H9N953
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
schemes:
  MDReader:
    build:
      targets:
        MDReader: all
    run:
      config: Debug
    archive:
      config: Release
