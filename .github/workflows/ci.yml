name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Scripts/stamp-build.sh derives the build number from git history
      - name: Toolchain versions
        run: sw_vers && xcodebuild -version
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Build (Debug)
        run: make build
      - name: Unit tests
        run: make test
